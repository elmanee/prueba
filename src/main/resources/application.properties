server.port=8080
spring.cloud.config.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# Configuración de Base de Datos PostgreSQL
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_servicios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:linux123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# ============================================================
# Servicio de Autenticación GestoPago
# ============================================================
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.endpoint=/sistema/app/jwt-gp/authenticate/
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}

# ============================================================
# Servicio Externo de Productos GestoPago
# ============================================================
gestopago.service.url=https://gestopago.portalventas.net
gestopago.service.endpoint=/sistema/service/getProductList.do
gestopago.service.id-distribuidor=83
gestopago.service.codigo-dispositivo=GPS83-TPV-17
gestopago.service.cron=0 0 3 * * ?
gestopago.productos.cron=0 0 3 * * ?

# ============================================================
# Parámetros de configuración OpenFeign (Timeouts y Logging)
# ============================================================
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=15000
spring.cloud.openfeign.client.config.gestoPagoAuth.connect-timeout=10000
spring.cloud.openfeign.client.config.gestoPagoAuth.read-timeout=30000
spring.cloud.openfeign.client.config.gestoPagoService.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoService.read-timeout=30000
spring.cloud.openfeign.client.config.gestoPagoProduct.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoProduct.read-timeout=30000

# Nivel de logging para rastreo de llamadas de clientes Feign
logging.level.com.proyecto.servicios.client=DEBUG

# ============================================================
# Configuración de Redis
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS:}
spring.cache.type=redis


